name: Clean build and backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qt-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libpulse-dev libegl1 libasound2t64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: false
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Check source tree stayed clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r python/server/requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - name: Check source tree stayed clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
