name: Clean build and backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qt-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libpulse-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: false
      - name: Reproduce original case-sensitive source failure
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/musicplayer-baseline"
          mkdir -p "$baseline"
          git archive HEAD | tar -x -C "$baseline"
          python - "$baseline/CMakeLists.txt" <<'PYCODE'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          path.write_text(path.read_text().replace("mediaplayerpool.h mediaplayerpool.cpp", "MediaPlayerPool.h mediaplayerpool.cpp"))
          PYCODE
          if cmake -S "$baseline" -B "$RUNNER_TEMP/baseline-build" -G Ninja -DCMAKE_BUILD_TYPE=Release > "$RUNNER_TEMP/baseline.log" 2>&1; then
            echo "Expected original filename mismatch to fail"
            exit 1
          fi
          cat "$RUNNER_TEMP/baseline.log"
          grep -q 'MediaPlayerPool.h' "$RUNNER_TEMP/baseline.log"
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r python/server/requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - name: Check source tree stayed clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
